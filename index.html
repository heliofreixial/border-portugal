<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,sans-serif;background:#f0f0ee;color:#1a1a18;min-height:100vh;-webkit-text-size-adjust:100%;padding-bottom:86px}
.w{max-width:480px;margin:0 auto;padding:14px}
.hdr{background:#1a3a6b;border-radius:14px;padding:15px 16px;text-align:center;color:#fff;margin-bottom:13px}
.hdr h1{font-size:18px;font-weight:700;margin-bottom:2px}
.hdr p{font-size:11px;opacity:.8}
/* Progress */
.prog{display:flex;gap:4px;margin-bottom:13px}
.pd{height:4px;flex:1;border-radius:2px;background:#d0d0cc}
.pd.on{background:#1a3a6b}
.pd.now{background:#4a8ad4}
/* Card */
.card{background:#fff;border-radius:14px;padding:17px 15px;margin-bottom:11px;border:1.5px solid #e0e0da}
.card h2{font-size:16px;font-weight:700;margin-bottom:4px;line-height:1.3}
.card p{font-size:13px;color:#6a6a65;margin-bottom:13px;line-height:1.5}
/* Options */
.opts{display:flex;flex-direction:column;gap:9px}
.opt{background:#f8f8f6;border:1.5px solid #e0e0da;border-radius:12px;padding:12px 13px;cursor:pointer;display:flex;align-items:center;gap:11px;-webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-touch-callout:none}
.opt:active{background:#e8eef8;border-color:#1a3a6b}
.oi{font-size:23px;flex-shrink:0;width:30px;text-align:center}
.ot{font-size:14px;font-weight:600;color:#1a1a18;line-height:1.3}
.os{font-size:11px;color:#6a6a65;margin-top:2px;line-height:1.3}
/* Language grid */
.lgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:4px}
.lbtn{background:#fff;border:1.5px solid #e0e0da;border-radius:12px;padding:10px 4px;text-align:center;cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-touch-callout:none}
.lbtn:active,.lbtn.sel{border-color:#1a3a6b;background:#e8eef8}
.lf{font-size:26px;display:block;margin-bottom:4px}
.ln{font-size:10px;font-weight:600;color:#2a2a28;line-height:1.2}
/* Buttons */
.btn{width:100%;padding:13px;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;border:1.5px solid #ddd;background:#fff;color:#5a5a56;margin-top:8px;-webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-touch-callout:none}
.btn:active{opacity:.75}
.btnp{background:#1a3a6b;color:#fff;border-color:#1a3a6b}
.btn2{display:flex;gap:8px;margin-top:10px}
.btn2 .btn{margin-top:0;flex:1}
/* Country search */
.srch{position:relative;margin-bottom:10px}
.srch input{width:100%;padding:12px 36px 12px 40px;font-size:16px;border:1.5px solid #ddd;border-radius:12px;background:#fff;color:#1a1a18;outline:none;-webkit-appearance:none}
.srch input:focus{border-color:#1a3a6b}
.srch .si{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:16px;pointer-events:none}
.srch .sc{position:absolute;right:11px;top:50%;transform:translateY(-50%);font-size:17px;color:#aaa;cursor:pointer;background:none;border:none;padding:4px;display:none}
.srch-res{background:#fff;border:1.5px solid #e0e0da;border-radius:12px;overflow:hidden;margin-top:4px;display:none}
.sri{padding:12px 14px;cursor:pointer;display:flex;align-items:center;gap:10px;border-bottom:1px solid #f0f0ee;touch-action:manipulation;-webkit-touch-callout:none}
.sri:last-child{border-bottom:none}
.sri:active{background:#e8eef8}
.sri-fl{font-size:22px;flex-shrink:0}
.sri-name{font-size:14px;font-weight:600;color:#1a1a18}
.sri-sub{font-size:11px;color:#6a6a65;margin-top:1px}
.srch-empty{padding:16px;text-align:center;font-size:13px;color:#888}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;margin-left:6px}
.b-sch{background:#d4edda;color:#155724}
.b-eu{background:#cce5ff;color:#004085}
.b-no{background:#f8d7da;color:#721c24}
/* Chip */
.chip-img{display:block;margin:8px auto 4px;width:40px;height:40px;object-fit:contain}
.clabel{text-align:center;font-size:12px;color:#888;margin-bottom:12px}
/* Result */
.rc{background:#fff;border-radius:14px;padding:17px 15px;border:2px solid #1a3a6b;margin-bottom:11px}
.rt{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#1a3a6b;margin-bottom:12px}
.rstep{display:flex;align-items:flex-start;gap:11px;margin-bottom:11px}
.rn{width:27px;height:27px;border-radius:50%;background:#1a3a6b;color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ra{font-size:15px;font-weight:700;color:#1a1a18;line-height:1.3}
.rd{font-size:12px;color:#5a5a56;margin-top:2px;line-height:1.4}
.eq{border-radius:11px;padding:12px 13px;display:flex;align-items:center;gap:12px;margin:10px 0;flex-wrap:wrap}
.eq-g{background:#e8f4e8;border:1.5px solid #6abf6a}
.eq-b{background:#e6f1fb;border:1.5px solid #7ab8e8}
.eq-a{background:#fce9c0;border:1.5px solid #e0a020}
.eq-r{background:#fde8e8;border:1.5px solid #e07070}
.eq-gr{background:#f0f0ee;border:1.5px solid #aaa}
.eqi{width:72px;height:50px;object-fit:cover;border-radius:7px;flex-shrink:0;border:1px solid rgba(0,0,0,.08)}
.box-art{width:72px;height:50px;border-radius:9px;position:relative;flex-shrink:0;background:linear-gradient(180deg,#f7fbff 0%,#e3eef7 100%);border:1px solid rgba(6,39,84,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.9)}
.box-art:before{content:"";position:absolute;left:12px;right:12px;top:8px;height:14px;border-radius:8px 8px 4px 4px;background:#1f4f88}
.box-art:after{content:"";position:absolute;left:8px;right:8px;bottom:8px;height:18px;border-radius:5px;background:linear-gradient(180deg,#5f85ad 0%,#2f5e92 100%)}
.box-panel{position:absolute;left:20px;top:14px;width:32px;height:10px;border-radius:3px;background:#eef4fa;border:1px solid rgba(255,255,255,.75);z-index:1}
.box-base{position:absolute;left:16px;right:16px;bottom:11px;height:8px;border-radius:4px;background:#173d67;z-index:1}
.box-art-mini{width:34px;height:24px;border-radius:6px;position:relative;flex-shrink:0;background:linear-gradient(180deg,#f7fbff 0%,#e3eef7 100%);border:1px solid rgba(6,39,84,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.9)}
.box-art-mini:before{content:"";position:absolute;left:6px;right:6px;top:4px;height:7px;border-radius:4px 4px 2px 2px;background:#1f4f88}
.box-art-mini:after{content:"";position:absolute;left:4px;right:4px;bottom:4px;height:8px;border-radius:3px;background:linear-gradient(180deg,#5f85ad 0%,#2f5e92 100%)}
.box-panel-mini{position:absolute;left:10px;top:6px;width:14px;height:5px;border-radius:2px;background:#eef4fa;border:1px solid rgba(255,255,255,.75);z-index:1}
.box-base-mini{position:absolute;left:8px;right:8px;bottom:5px;height:4px;border-radius:2px;background:#173d67;z-index:1}
.eqt{font-size:15px;font-weight:700;line-height:1.3}
.eq-g .eqt{color:#0e5c30}
.eq-b .eqt{color:#0a3870}
.eq-a .eqt{color:#7a4200}
.eq-r .eqt{color:#700000}
.eq-gr .eqt{color:#3a3a3a}
.eqs{font-size:12px;margin-top:2px;line-height:1.4;opacity:.85}
.qb{display:inline-block;color:#fff;font-size:13px;font-weight:700;padding:5px 14px;border-radius:20px;margin-top:8px}
.qb-eu{background:#0e5c30}
.qb-all{background:#185fa5}
.qb-crew{background:#5a5a56}
.qb-dip{background:#7a4200}
.route-note{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:9px;padding:10px 12px;border-radius:10px}
.route-note-warm{background:#fff3cd;border:1.5px solid #ffc107;color:#5a3e00}
.route-note-cool{background:#e6f1fb;border:1.5px solid #7ab8e8;color:#0a3870}
.route-note-copy{font-size:12px;font-weight:700;line-height:1.4;min-width:0;flex:1}
.route-note-media{display:flex;align-items:center;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.route-note-stack{display:flex;flex-direction:column;gap:8px;align-items:stretch;min-width:0}
.route-row{display:flex;align-items:center;gap:8px}
.route-icon{width:34px;height:24px;object-fit:cover;border-radius:5px;border:1px solid rgba(0,0,0,.08);flex-shrink:0}
.route-pill{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:54px}
.route-sign-label{font-size:10px;font-weight:700;line-height:1.2;text-align:center}
.route-row .route-sign-label{font-size:11px;text-align:left;line-height:1.25}
.sign-canal{width:40px;background:#191919;border-radius:4px;padding:3px 4px 4px;display:flex;flex-direction:column;align-items:center;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.sign-canal-num{width:26px;height:24px;border-radius:3px;background:#fff;border:1px solid #d8d8d8;color:#232323;font-size:21px;font-weight:800;display:flex;align-items:center;justify-content:center;line-height:1}
.sign-canal-text{margin-top:3px;color:#d3b112;font-size:6px;font-weight:800;line-height:1;text-transform:lowercase;letter-spacing:.02em}
.sign-euch{display:flex;align-items:stretch;border-radius:4px;overflow:hidden;border:1px solid rgba(0,0,0,.12);background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.sign-euch-flag{width:28px;background:#1d5fa8;color:#ffd74a;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.sign-euch-copy{padding:3px 6px;background:#fff;color:#222;font-size:11px;font-weight:800;line-height:1.05;display:flex;flex-direction:column;justify-content:center}
.al-m{background:#fff3cd;border:1.5px solid #ffc107;border-radius:10px;padding:10px 12px;font-size:12px;margin-top:9px;line-height:1.55;color:#5a3e00}
.al-i{background:#e6f1fb;border:1.5px solid #7ab8e8;border-radius:10px;padding:10px 12px;font-size:12px;margin-top:9px;line-height:1.55;color:#0a3870}
.al-w{background:#fde8e8;border:1.5px solid #e07070;border-radius:10px;padding:10px 12px;font-size:12px;margin-top:9px;line-height:1.55;color:#700000}
.al-g{background:#e8f4e8;border:1.5px solid #6abf6a;border-radius:10px;padding:10px 12px;font-size:12px;margin-top:9px;line-height:1.55;color:#0e5c30}
.no-border-info{background:#fff;border-radius:14px;padding:20px 15px;border:2px solid #6abf6a;margin-bottom:11px;text-align:center}
.no-border-icon{font-size:48px;margin-bottom:10px}
.no-border-title{font-size:18px;font-weight:700;color:#0e5c30;margin-bottom:6px}
.no-border-sub{font-size:13px;color:#2a6a40;line-height:1.5}

/* Footer logos */
.footer{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;height:70px;background:#fff;border-top:1px solid #ddd;display:flex;align-items:center;justify-content:center;box-shadow:0 -2px 6px rgba(0,0,0,0.05);z-index:999}
.footer-inner{width:100%;display:flex;align-items:center;justify-content:space-between;gap:2px;padding:0 6px;}
.footer-logo{flex:1 1 0;min-width:0;display:flex;align-items:center;justify-content:center;padding:0;}
.footer-logo img{max-height:18px;max-width:100%;width:auto;object-fit:contain;opacity:.85}
.footer-logo:nth-child(1) img{max-height:23px}
.footer-logo.logo-ssi img{max-height:44px}
.footer-logo.logo-ssi{flex:1.6 1 0;}
.footer-logo.logo-gnr img{max-height:16px}
.footer-logo.logo-psp img{max-height:18px}
.footer-logo.logo-psp{margin-right:11px;}

.ssk-questionnaire-title{font-size:17px;font-weight:800;color:#233a55}

.ssk-form-main{padding:14px 12px 15px}

/* ─── Estado ─── */
var L='en', S={}, H=[], SC=[];
// onTap — padrão Pontos Azuis: touchend (iOS) + click (desktop), ambos registados
var _screenChangedAt = 0;

function onTap(el, fn){
  if(!el) return;
  var _fired = false;
  if(window.PointerEvent){
    el.addEventListener('pointerup', function(e){
      if(e.target !== el && !el.contains(e.target)) return;
      // Ignorar se o ecrã mudou há menos de 350ms (click fantasma do ecrã anterior)
      if(Date.now() - _screenChangedAt < 350) return;
      _fired = true;
      fn.call(el, e);
    });
  }
  el.addEventListener('click', function(e){
    if(_fired){ _fired = false; return; }
    // Ignorar clicks que chegam logo após mudança de ecrã
    if(Date.now() - _screenChangedAt < 350) return;
    fn.call(el, e);
  });
}

  var nq=norm(q);
  return COUNTRIES.filter(function(c){
    var fields=[c.en,c.pt,c.fr,c.es,c.de,c.it,c.zh,c.ar,c.hi,c.ru];
    return fields.some(function(n){ return norm(n).indexOf(nq)>=0; });
  }).slice(0,7);
}

function countryBadge(c){
  if(c.sch) return '<span class="badge b-sch">Schengen</span>';
  if(c.eu)  return '<span class="badge b-eu">EU</span>';
  return '';
}

/* ─── Componente de pesquisa reutilizável ─── */
function mkSearch(inputId, resId, clearId, ph, onPick){
  var si=document.getElementById(inputId);
  var sr=document.getElementById(resId);
  var sc=document.getElementById(clearId);
  if(!si) return;
  // Guardar onPick globalmente para o onclick inline poder aceder
  window._srchPick = function(ci){ onPick(COUNTRIES[ci]); };
  function run(){
    var q=si.value.trim();
    sc.style.display=q?'block':'none';
    var hits=searchCountries(q);
    if(!q||!hits.length){ sr.style.display='none'; sr.innerHTML=''; return; }
    sr.innerHTML=hits.map(function(c){
      return '<div class="sri" data-ci="'+COUNTRIES.indexOf(c)+'">'+
        '<span class="sri-fl">'+c.f+'</span>'+
        '<div><div class="sri-name">'+langName(c)+countryBadge(c)+'</div></div></div>';
    }).join('');
    sr.style.display='block';
    sr.querySelectorAll('.sri').forEach(function(el){
      var ci = +el.getAttribute('data-ci');
      onTap(el, function(){ onPick(COUNTRIES[ci]); });
    });

  }

  // 'input' é suficiente — cobre todos os browsers incluindo iOS Safari
  si.addEventListener('input', run);
  si.addEventListener('keydown',function(e){ if(e.key==='Enter'){ si.blur(); run(); } });

  // Botão limpar via função global
  window._srchClear = function(id){
    var inp=document.getElementById('srch-'+id);
    var res=document.getElementById('srch-res-'+id);
    var clr=document.getElementById('srch-clr-'+id);
    if(inp){ inp.value=''; inp.focus(); }
    if(res){ res.style.display='none'; res.innerHTML=''; }
    if(clr){ clr.style.display='none'; }
  };
}

function srchHTML(id, ph){
  return '<div class="srch">'+
    '<span class="si">🔍</span>'+
    '<input id="srch-'+id+'" type="text" inputmode="search" autocapitalize="none" autocomplete="off" autocorrect="off" autocomplete="off" spellcheck="false" placeholder="'+ph+'">'+
    '<button class="sc" id="srch-clr-'+id+'" onclick="_srchClear(\''+id+'\')" type="button">✕</button>'+
    '</div>'+
    '<div id="srch-res-'+id+'" class="srch-res"></div>';
}

function initSearch(id, onPick){
  mkSearch('srch-'+id,'srch-res-'+id,'srch-clr-'+id,'',onPick);
}

/* ─── Progress bar ─── */
var TOTAL_STEPS=8;
function prog(n){
  var h='';
  for(var i=0;i<TOTAL_STEPS;i++) h+='<div class="pd'+(i<n?' on':i===n?' now':'')+'"></div>';
  document.getElementById('prog').innerHTML=h;
}

/* ─── Botão voltar ─── */
function backBtn(){
  return '<button class="btn" id="btn-back">'+t('bk')+'</button>';
}
function wireBack(){
  var b = document.getElementById('btn-back');
  if(!b) return;
  onTap(b, function(){ H.length>0 ? goBack() : showLang(); });
}

/* ─── Opt helper ─── */
function opt(icon, title, sub, val){
  return '<div class="opt" data-val="'+val+'">'+
    '<div class="oi">'+icon+'</div>'+
    '<div><div class="ot">'+title+'</div>'+(sub?'<div class="os">'+sub+'</div>':'')+
    '</div></div>';
}
function wireOpts(){
  document.querySelectorAll('.opt').forEach(function(el){
    var v = el.getAttribute('data-val');
    onTap(el, function(){ pick(v); });
  });
}

/* ─── Resultado: ecrã "não precisas de passar fronteira" ─── */
function showNoBorder(subKey){
  prog(TOTAL_STEPS);
  var titleKey = subKey==='no_border_sub_ent_sch' ? 'no_border_title_ent' : 'no_border_title';
  var icon = subKey==='no_border_sub_ent_sch' ? '🧳' : '✅';
  var h='<div class="no-border-info">'+
    '<div class="no-border-icon">'+icon+'</div>'+
    '<div class="no-border-title">'+t(titleKey)+'</div>'+
    '<div class="no-border-sub">'+t(subKey)+'</div>'+
    '</div>';
  h+='<div class="btn2">'+
    '<button class="btn" id="btn-back">'+t('bk')+'</button>'+
    '<button class="btn btnp" id="btn-restart">'+t('br')+'</button>'+
    '</div>';
  set(h);
  wireBack();

}

/* ─── ECRÃS ─── */

function showLang(){
  document.body.style.direction=L==='ar'?'rtl':'ltr';
  prog(0);
  var h='<div class="card"><h2>'+t('ls')+'</h2><div style="height:8px"></div><div class="lgrid">';
  var LANGS=[
    {c:'pt',f:'🇵🇹',n:'Português'},{c:'br',f:'🇧🇷',n:'Português BR'},
    {c:'en',f:'🇬🇧',n:'English'},{c:'fr',f:'🇫🇷',n:'Français'},
    {c:'es',f:'🇪🇸',n:'Español'},{c:'de',f:'🇩🇪',n:'Deutsch'},
    {c:'it',f:'🇮🇹',n:'Italiano'},{c:'zh',f:'🇨🇳',n:'中文'},
    {c:'ar',f:'🇸🇦',n:'العربية'},{c:'hi',f:'🇮🇳',n:'हिन्दी'},
    {c:'ru',f:'🇷🇺',n:'Русский'}
  ];
  LANGS.forEach(function(l){
    h+='<div class="lbtn'+(L===l.c?' sel':'')+'" data-lang="'+l.c+'">'+
      '<span class="lf">'+l.f+'</span><span class="ln">'+l.n+'</span></div>';
  });
  h+='</div></div>';
  h+='<button class="btn btnp" id="btn-go">'+t('go')+'</button>';
  set(h);

  // Listeners botões de língua
  document.querySelectorAll('.lbtn').forEach(function(el){
    var code = el.getAttribute('data-lang');
    onTap(el, function(){ pickLang(code); });
  });
  var bg = document.getElementById('btn-go');
  onTap(bg, function(){ S={}; H=[]; showDir(); });
}

function pickLang(code){ L=code; document.body.style.direction=L==='ar'?'rtl':'ltr'; showLang(); }

function showDir(){
  
  prog(1);
  var h='<div class="card"><h2>'+t('qd')+'</h2><p>'+t('qs')+'</p><div class="opts">'+
    opt('✈️',t('ent'),t('ents'),'ent')+
    opt('🛫',t('sai'),t('sais'),'sai')+
    opt('🔁',t('tra'),t('tras'),'tra')+
    '</div></div>';
  h+=backBtn();
  set(h);
  wireOpts(); wireBack();
}

function showOriginCountry(dir){
  
  S.dir=dir;
  prog(2);
  var qKey = dir==='ent' ? 'q_orig_ent' : 'q_orig_sai';
  var qsKey = dir==='ent' ? 'q_orig_ent_s' : 'q_orig_sai_s';
  var h='<div class="card"><h2>'+t(qKey)+'</h2><p>'+t(qsKey)+'</p>'+
    srchHTML('orig',t('srch_ph'))+
    '</div>';
  h+=backBtn();
  set(h);
  wireBack();
  initSearch('orig',function(c){
    S.originCountry=c;
    H.push('orig:'+c.en);
    if(c.sch){
      // Schengen — sem controlo de fronteira
      if(dir==='ent'){
        showNoBorder('no_border_sub_ent_sch'); // Entrada de Schengen → bagagem e saída
      } else {
        showNoBorder('no_border_sub_sai'); // Saída para Schengen → embarque
      }
    } else {
      showDoc();
    }
  });
}

/* ─── pick() — router central ─── */
function pick(val){
  // Dir
  if(!S.dir && (val==='ent'||val==='sai'||val==='tra')){
    S.rootDir=val;
    H.push('dir:'+val);
    if(val==='tra') showTransitAirport();
    else showOriginCountry(val);
    return;
  }
  // Transit airport
  if(S.dir==='tra' && !S.traApt){
    S.traApt=val;
    H.push('tra_apt:'+val);
    if(val==='same') showTransitDest();
    else { S.dir='ent'; showOriginCountry('ent'); } // outro aeroporto = passa fronteira
    return;
  }
  // Doc
  if(!S.doc){
    S.doc=val;
    H.push('doc:'+val);
    if(val==='re') { showTRCountry(); return; }
    if(val==='tc') { showChip(); return; }
    if(val==='cr') { showCrewUniform(); return; }
    if(val==='di') { showResult(); return; } // diplomático → directo ao resultado
    showMinor(); return;
  }
  // Fam card
  if(S.doc==='fa' && S.famCard===undefined){
    S.famCard=val; H.push('fam:'+val); showMinor(); return;
  }
  // Chip
  if(S.doc==='tc' && S.chip===undefined){
    S.chip=val;
    H.push('chip:'+val);
    if(val==='n') { showResult(); return; }
    showNat(); return;
  }
  // Nat
  if(S.doc==='tc' && S.chip==='y' && !S.nat){
    S.nat=val; H.push('nat:'+val); showMinor(); return;
  }
  // Crew uniform
  if(S.doc==='cr' && S.crewUnif===undefined){
    S.crewUnif=val;
    H.push('crew_unif:'+val);
    if(val==='n') { showResult(); return; }
    showCrewID(); return;
  }
  // Crew ID
  if(S.doc==='cr' && S.crewUnif==='y' && S.crewID===undefined){
    S.crewID=val; H.push('crew_id:'+val); showResult(); return;
  }
  // Minor
  // TR país
  if(S.doc==='re' && S.trCountry===undefined && (val==='tr_pt'||val==='tr_other')){
    S.trCountry=val;
    H.push('tr_country:'+val);
    showMinor(); return;
  }
  if(S.minor===undefined){
    S.minor=val;
    H.push('minor:'+val);
    if(val==='minor') { showMinorAlone(); return; }
    showResult(); return;
  }
  // Sub-pergunta do menor
  if(S.minorAlone===undefined && S.minor==='minor'){
    S.minorAlone=val;
    H.push('minor_alone:'+val);
    showResult(); return;
  }
}

/* ─── goBack ─── */
function goBack(){
  if(H.length===0){ showLang(); return; }

  // Remover última entrada do H e desfazer o estado correspondente
  var last = H.pop();
  var p=last.split(':'), k=p[0];
  if(k==='dir')         { delete S.dir; delete S.rootDir; }
  if(k==='orig')        { delete S.originCountry; }
  if(k==='tra_apt')     { delete S.traApt; }
  if(k==='tradest')     { delete S.transitDest; }
  if(k==='doc')         { delete S.doc; }
  if(k==='chip')        { delete S.chip; }
  if(k==='nat')         { delete S.nat; }
  if(k==='crew_unif')   { delete S.crewUnif; }
  if(k==='crew_id')     { delete S.crewID; }
  if(k==='tr_country')  { delete S.trCountry; }
  if(k==='minor')       { delete S.minor; }
  if(k==='minor_alone') { delete S.minorAlone; }
  if(k==='ssk_info')    {}

  switch(k){
    case 'dir':
      showLang();
      break;
    case 'orig':
      showOriginCountry(S.rootDir==='tra' && S.traApt==='other' ? 'ent' : (S.rootDir||S.dir||'ent'));
      break;
    case 'tra_apt':
      showTransitAirport();
      break;
    case 'tradest':
      showTransitDest();
      break;
    case 'doc':
      showDoc();
      break;
    case 'tr_country':
      showTRCountry();
      break;
    case 'chip':
      showChip();
      break;
    case 'nat':
      showNat();
      break;
    case 'crew_unif':
      showCrewUniform();
      break;
    case 'crew_id':
      showCrewID();
      break;
    case 'minor':
      showMinor();
      break;
    case 'minor_alone':
      showMinorAlone();
      break;
    case 'ssk_info':
      showResult();
      break;
    default:
      showDir();
  }

}

/* ─── Resultado ─── */
function step(n,a,d){ return '<div class="rstep"><div class="rn">'+n+'</div><div><div class="ra">'+a+'</div><div class="rd">'+d+'</div></div></div>'; }

function showResult(){
  prog(TOTAL_STEPS);
  var dir=S.dir||'ent', doc=S.doc||'', chip=S.chip||'', nat=S.nat||'',
      fam=S.famCard||'', minor=S.minor||'', crewUnif=S.crewUnif||'', crewID=S.crewID||'';
  var isExit=(dir==='sai');
  var steps='', eq='', qb='', alerts='';

  // ── Menor não acompanhado (minor=minor + minorAlone=alone) ──
  if(S.minor==='minor' && S.minorAlone==='alone'){
    steps=step(1,t('s_box'),t('s_boxd'));
    eq='<div class="eq eq-b">'+eqImg('bx')+'<div><div class="eqt">'+t('dbo')+'</div><div class="eqs">'+t('dbos')+'</div></div></div>';
    alerts='<div class="al-w">'+t('al_unaccomp')+'</div>';
    qb=routeNote('cool',t('qal'),routePill(signCanal(2),'Canal 2'));
  }
  // ── Tripulação ──
  else if(doc==='cr'){
    if(crewUnif==='y' && crewID==='y'){
      steps=step(1,t('s_crew'),t('s_crewd'));
      eq='<div class="eq eq-gr">'+eqImg('bx')+'<div><div class="eqt">'+t('dcrew')+'</div><div class="eqs">'+t('dcrews')+'</div></div></div>';
      qb='<div class="qb qb-crew">'+t('qcrew')+'</div>';
      alerts='<div class="al-i">'+t('al_crew_only1')+' '+t('al_crew_only2')+'</div>';
    } else if(crewUnif==='n'||crewID==='n'){
      steps=step(1,t('s_box'),t('s_boxd'));
      eq='<div class="eq eq-b">'+eqImg('bx')+'<div><div class="eqt">'+t('dbo')+'</div><div class="eqs">'+t('dbos')+'</div></div></div>';
      alerts='<div class="al-w">'+t('al_crew_noconf')+'</div>';
      qb='<div class="qb qb-all">'+t('qal')+'</div>';
    }
  }
  // ── Diplomático / Serviço / NATO ──
  // Todos ao balcão manual directo (sem SSK)
  // Isenção EES (diplomáticos de alguns países, serviço, NATO) é tratada pelo agente
  else if(doc==='di'){
    steps=step(1,t('s_box'),t('s_dip_d'));
    eq='<div class="eq eq-b">'+eqImg('bx')+'<div><div class="eqt">'+t('dbo')+'</div><div class="eqs">'+t('dbos')+'</div></div></div>';
    qb='<div class="qb qb-dip">'+t('qdip')+'</div>';
    alerts='<div class="al-i">'+t('al_dip')+'</div>';
  }
  // ── UE ──
  else if(doc==='ue'){
    if(minor==='minor'||(minor!=='minor'&&false)){
      // menor (tratado abaixo via flag minor)
    }
    var isMinor=(minor==='minor');
    var lim=isExit?18:16;
    if(isMinor){
      steps=step(1,t('s_box_eu'),t('s_box_eud'));
      eq='<div class="eq eq-b">'+eqImg('bx')+'<div><div class="eqt">'+t('dbo')+'</div><div class="eqs">'+t('dbos')+'</div></div></div>';
      alerts='<div class="al-m">'+(isExit?t('al_minor_sai'):t('al_minor_ent'))+'</div>';
      qb=routeNote('cool',t('qeu'),routePill(signEuCh(),'Fila UE / CH'));
    } else {
      steps=step(1,t('s_egate'),t('s_egated'));
      eq='<div class="eq eq-g">'+eqImg('eg')+'<div><div class="eqt">'+t('deg')+'</div><div class="eqs">'+t('degs')+'</div></div></div>';
      qb=routeNote('warm','Fila / canal',routePill(signCanal(1),'Canal 1')+routePill(signEuCh(),'Fila UE / CH'));
    }
  }
  // ── Título Residência ──
  else if(doc==='re'){
    var trPT=(S.trCountry==='tr_pt');
    if(trPT){
      // TR Portugal → e-gate directa, fila EU — excepto menores
      var isMinor=(minor==='minor');
      if(isMinor){
        steps=step(1,t('s_box'),t('s_boxd'));
        eq='<div class="eq eq-b">'+eqImg('bx')+'<div><div class="eqt">'+t('dbo')+'</div><div class="eqs">'+t('dbos')+'</div></div></div>';
        qb=routeNote('cool',t('qal'),routePill(signCanal(2),'Canal 2'));
        alerts='<div class="al-m">'+(isExit?t('al_minor_sai'):t('al_minor_ent'))+'</div>';
      } else {
        steps=step(1,t('s_egate'),t('s_egated'));
        eq='<div class="eq eq-g">'+eqImg('eg')+'<div><div class="eqt">'+t('deg')+'</div><div class="eqs">'+t('degs')+'</div></div></div>';
        qb=routeNote('warm','Fila / canal',routePill(signCanal(1),'Canal 1')+routePill(signEuCh(),'Fila UE / CH'));
      }
    } else {
      // TR outro país → balcão manual
      steps=step(1,t('s_box'),t('s_boxd'));
      eq='<div class="eq eq-b">'+eqImg('bx')+'<div><div class="eqt">'+t('dbo')+'</div><div class="eqs">'+t('dbos')+'</div></div></div>';
      qb=routeNote('cool',t('qal'),routePill(signCanal(2),'Canal 2'));
      if(minor==='minor') alerts='<div class="al-m">'+(isExit?t('al_minor_sai'):t('al_minor_ent'))+'</div>';
    }
  }

  // ── TCE sem chip ──
  else if(doc==='tc' && chip==='n'){
    steps=step(1,t('s_box'),t('s_boxd'));
    eq='<div class="eq eq-b">'+eqImg('bx')+'<div><div class="eqt">'+t('dbo')+'</div><div class="eqs">'+t('dbos')+'</div></div></div>';
    qb=routeNote('cool',t('qal'),routePill(signCanal(2),'Canal 2'));
    alerts='<div class="al-i">'+t('al_nochip')+'</div>';
  }
  // ── TCE com chip ──
  else if(doc==='tc' && chip==='y'){
    var isEgate=(nat==='ee'||nat==='es');
    var isMinor=(minor==='minor');
    if(isEgate && !isMinor){
      steps=step(1,isExit?t('s_ssk_exit'):t('s_ssk'),isExit?t('s_ssk_exitd'):t('s_sskd'))+step(2,t('s_queue_ssk'),t('s_queue_sskd'));
      eq='<div class="eq eq-a">'+eqImg('sk')+'<div><div class="eqt">'+t('ssk_title_route')+'</div><div class="eqs">'+t('ssk_desc_route')+'</div></div></div>';
      qb=routeNoteSsk(t('ssk_after'),t('ssk_if_egate'),t('ssk_if_box'));
    } else {
      steps=step(1,isExit?t('s_ssk_exit'):t('s_ssk'),isExit?t('s_ssk_exitd'):t('s_sskd'))+step(2,t('s_box2'),t('s_box2d'));
      eq='<div class="eq eq-a">'+eqImg('sk_bx')+'<div><div class="eqt">'+t('dsb')+'</div><div class="eqs">'+t('dsbs')+'</div></div></div>';
      qb=routeNoteSskBoxOnly(t('qal'));
    }
    if(isMinor) alerts='<div class="al-m">'+(isExit?t('al_minor_sai'):t('al_minor_ent'))+'</div>';
  }
  else {
    steps=step(1,t('s_box'),t('s_boxd'));
    eq='<div class="eq eq-b">'+eqImg('bx')+'<div><div class="eqt">'+t('dbo')+'</div><div class="eqs">'+t('dbos')+'</div></div></div>';
    qb=routeNote('cool',t('qal'),routePill(signCanal(2),'Canal 2'));
  }

  var h='<div class="rc"><div class="rt">'+t('yr')+'</div>'+steps+eq+qb+alerts+'</div>';
  h+='<div class="btn2"><button class="btn" id="btn-back">'+t('bk')+'</button><button class="btn btnp" id="btn-restart">'+t('br')+'</button></div>';
  if(doc==='tc' && chip==='y') h+=sskInfoCard();
  set(h);
  wireBack();
  var br = document.getElementById('btn-restart');
  onTap(br, restart);
  var sskGuide=document.getElementById('btn-ssk-guide');
  if(sskGuide){
    onTap(sskGuide,function(){
      H.push('ssk_info:1');
      showSskGuide();
    });
  }
}

/* ─── Atalho rápido por país (da search na língua) ─── */
function quickRouteFromCountry(c, defaultDir){
  S={}; H=[];
  S.dir=defaultDir;
  H.push('dir:'+defaultDir);
  if(c.sch){ showNoBorder('no_border_sub'); return; }
  S.originCountry=c;
  H.push('orig:'+c.en);
  showDoc();
}

function restart(){ S={}; H=[]; showLang(); }

// Init
showLang();
